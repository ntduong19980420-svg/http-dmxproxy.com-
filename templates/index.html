                    </div>

                    <button id="btnGenerate" class="btn btn-primary w-100 py-2 fw-bold">
                        ⚡ Generate Proxy
                    </button>

                    <div class="mt-4">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50px;">#</th>
                                    <th>PROXY</th>
                                    <th style="width: 120px;">STATUS</th>
                                </tr>
                            </thead>
                            <tbody id="proxyRows">
                                <tr>
                                    <td colspan="3" class="text-center text-muted">Chưa có proxy nào được tạo. Nhấn "Generate Proxy" để lấy danh sách.</td>

    <script>
        document.getElementById('btnGenerate').addEventListener('click', function() {
            const country = document.getElementById('country').value;
            const os = document.getElementById('os').value;
            const qty = document.getElementById('qty').value;
            const tbody = document.getElementById('proxyRows');

            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Đang tạo proxy...</td></tr>';

            fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ country: country, os: os, qty: qty })
            })
            .then(res => res.json())
            .then(data => {
                if (data.proxies && data.proxies.length > 0) {
                    tbody.innerHTML = '';
                    data.proxies.forEach((proxy, idx) => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${idx + 1}</td>
                                <td class="font-monospace">${proxy}</td>
                                <td><span class="badge bg-success">Active</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Lỗi lấy proxy!</td></tr>';
                }
            })
            .catch(err => {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Lỗi kết nối Server!</td></tr>';
            });
        });
