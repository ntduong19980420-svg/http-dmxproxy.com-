    <script>
        let currentProxies = [];

        function randomIP() {
            return Math.floor(Math.random() * 200 + 10) + "." + 
                   Math.floor(Math.random() * 255) + "." + 
                   Math.floor(Math.random() * 255) + "." + 
                   Math.floor(Math.random() * 255);
        }

        document.getElementById('btnGenerate').addEventListener('click', function() {
            const country = document.getElementById('country').value;
            const os = document.getElementById('os').value;
            const qty = document.getElementById('qty').value;
            const tbody = document.getElementById('proxyRows');

            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div>Đang tạo proxy...</td></tr>';

            fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ country: country, os: os, qty: qty })
            })
            .then(res => res.json())
            .then(data => {
                if (data.proxies && data.proxies.length > 0) {
                    currentProxies = data.proxies;
                    tbody.innerHTML = '';
                    document.getElementById('listQty').innerText = data.proxies.length;
                    document.getElementById('genCount').innerText = `Generated ${data.proxies.length}.`;

                    data.proxies.forEach((proxy, idx) => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="text-muted">${idx + 1}</td>
                                <td class="font-monospace text-break">${proxy}</td>
                                <td class="text-end"><span class="ip-badge"><i class="status-dot"></i>${randomIP()}</span></td>
                            </tr>
                        `;
                    });
                }
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger py-4">Lỗi kết nối Server!</td></tr>';
            });
        });

        document.getElementById('btnCopy').addEventListener('click', function() {
            if (currentProxies.length === 0) return alert('Chưa có proxy nào để copy!');
            navigator.clipboard.writeText(currentProxies.join('\n'));
            alert('Đã copy toàn bộ danh sách proxy!');
        });

        document.getElementById('btnExport').addEventListener('click', function() {
            if (currentProxies.length === 0) return alert('Chưa có proxy nào để tải về!');
            const blob = new Blob([currentProxies.join('\n')], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'proxies.txt';
            a.click();
        });
    </script>
